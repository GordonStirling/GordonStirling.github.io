<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gordon Stirling</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #090909;
      --text: #f3f1ec;
      --muted: #aaa7a1;
      --nav: #e1ded8;
      --line: #2a2a2a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "IBM Plex Sans", sans-serif;
    }

    .site {
      max-width: 1080px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 38px 48px 52px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .name {
      font-family: "IBM Plex Mono", monospace;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.035em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 30px;
    }

    nav a {
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      color: var(--nav);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.045em;
    }

    nav a:hover {
      color: var(--text);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 0;
    }

    .intro {
      max-width: 880px;
      margin-bottom: 72px;
    }

    .intro h1 {
      margin: 0 0 24px;
      font-family: "Inter Tight", sans-serif;
      font-size: clamp(50px, 6vw, 76px);
      font-weight: 500;
      line-height: 0.98;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .intro p {
      margin: 0;
      max-width: 650px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .sections {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .sections a {
      padding: 28px 24px 30px 0;
      color: var(--text);
      text-decoration: none;
      border-right: 1px solid var(--line);
    }

    .sections a:nth-child(2),
    .sections a:last-child {
      padding-left: 24px;
    }

    .sections a:last-child {
      border-right: none;
    }

    .section-number {
      display: block;
      margin-bottom: 15px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .section-title {
      display: inline-block;
      font-family: "Inter Tight", sans-serif;
      font-size: 30px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.025em;
      text-transform: uppercase;
      transition: opacity 0.2s ease;
    }

    .sections a:hover .section-title {
      opacity: 0.62;
    }

    @media (max-width: 700px) {
      .site {
        padding: 26px 22px 36px;
      }

      header {
        display: block;
      }

      nav {
        margin-top: 15px;
        gap: 18px;
      }

      main {
        justify-content: flex-start;
        padding: 64px 0;
      }

      .intro {
        margin-bottom: 54px;
      }

      .intro h1 {
        font-size: clamp(44px, 12vw, 62px);
      }

      .sections {
        grid-template-columns: 1fr;
      }

      .sections a,
      .sections a:nth-child(2),
      .sections a:last-child {
        padding: 24px 0;
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .sections a:last-child {
        border-bottom: none;
      }
    }
  </style>
</head>

<body>

  <div class="site">

    <header>
      <div class="name">Gordon Stirling</div>

      <nav>
        <a href="writing.html">Writing</a>
        <a href="research.html">Research</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main>

      <div class="intro">

        <h1>
          Making data useful<br>
          in practice.
        </h1>

        <p>
          Writing about how data moves from analysis to understanding,
          decisions and practice.
        </p>

      </div>

      <div class="sections">

        <a href="writing.html">
          <span class="section-number">01</span>
          <span class="section-title">Writing</span>
        </a>

        <a href="research.html">
          <span class="section-number">02</span>
          <span class="section-title">Research</span>
        </a>

        <a href="about.html">
          <span class="section-number">03</span>
          <span class="section-title">About</span>
        </a>

      </div>

    </main>

  </div>

</body>
</html>
