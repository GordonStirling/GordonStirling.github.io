<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gordon Stirling</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Inter+Tight:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #080808;
      --text: #f3f1ec;
      --muted: #b8b5af;
      --nav: #dedbd5;
      --line: #292929;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #080808 !important;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #080808 !important;
      color: var(--text);
      font-family: "IBM Plex Sans", sans-serif;
    }

    .site {
      width: 100%;
      max-width: 1220px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 38px 54px 70px;
      background: #080808;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .name {
      font-family: "IBM Plex Mono", monospace;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 34px;
    }

    nav a {
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      color: var(--nav);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    nav a:hover {
      color: var(--text);
    }

    main {
      padding: 82px 0 90px;
    }

    .intro {
      max-width: 1020px;
      margin-bottom: 92px;
    }

    .intro h1 {
      margin: 0 0 38px;
      max-width: 850px;
      font-family: "Inter Tight", sans-serif;
      font-size: clamp(58px, 6.2vw, 86px);
      font-weight: 500;
      line-height: 0.96;
      letter-spacing: -0.045em;
      text-transform: uppercase;
    }

    .intro p {
      margin: 0;
      max-width: 980px;
      color: var(--muted);
      font-size: 36px;
      line-height: 1.35;
      letter-spacing: -0.025em;
    }

    .sections {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      min-height: 230px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .sections a {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text);
      text-decoration: none;
      border-right: 1px solid var(--line);
      transition: background-color 0.2s ease;
    }

    .sections a:last-child {
      border-right: none;
    }

    .section-content {
      text-align: center;
    }

    .section-number {
      display: block;
      margin-bottom: 18px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .section-title {
      display: block;
      font-family: "Inter Tight", sans-serif;
      font-size: 32px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.025em;
      text-transform: uppercase;
    }

    .sections a:hover {
      background: #101010;
    }

    .sections a:hover .section-number {
      color: var(--nav);
    }

    @media (max-width: 700px) {

      .site {
        padding: 26px 22px 40px;
      }

      header {
        display: block;
      }

      nav {
        margin-top: 16px;
        gap: 20px;
      }

      main {
        padding: 52px 0 60px;
      }

      .intro {
        margin-bottom: 54px;
      }

      .intro h1 {
        margin-bottom: 26px;
        font-size: clamp(46px, 13vw, 64px);
      }

      .intro p {
        font-size: 21px;
        line-height: 1.45;
      }

      .sections {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .sections a {
        min-height: 140px;
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .sections a:last-child {
        border-bottom: none;
      }
    }

  </style>
</head>

<body>

  <div class="site">

    <header>

      <div class="name">
        Gordon Stirling
      </div>

      <nav>
        <a href="writing.html">Writing</a>
        <a href="research.html">Research</a>
        <a href="about.html">About</a>
      </nav>

    </header>

    <main>

      <div class="intro">

        <h1>
          Making data useful<br>
          in practice.
        </h1>

        <p>
          Writing about how data moves from analysis to understanding,
          decisions and practice.
        </p>

      </div>

      <div class="sections">

        <a href="writing.html">
          <div class="section-content">
            <span class="section-number">01</span>
            <span class="section-title">Writing</span>
          </div>
        </a>

        <a href="research.html">
          <div class="section-content">
            <span class="section-number">02</span>
            <span class="section-title">Research</span>
          </div>
        </a>

        <a href="about.html">
          <div class="section-content">
            <span class="section-number">03</span>
            <span class="section-title">About</span>
          </div>
        </a>

      </div>

    </main>

  </div>

</body>
</html>
