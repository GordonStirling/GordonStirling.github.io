<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gordon Stirling</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #171717;
      --text: #f2f0eb;
      --muted: #aaa7a1;
      --line: #343434;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "IBM Plex Sans", sans-serif;
    }

    .site {
      max-width: 1080px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 38px 48px 52px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .name {
      font-family: "IBM Plex Mono", monospace;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    nav a:hover {
      color: var(--text);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 0;
    }

    .intro {
      max-width: 780px;
      margin-bottom: 70px;
    }

    .intro h1 {
      margin: 0 0 20px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(52px, 7vw, 86px);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .intro p {
      margin: 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.55;
    }

    .sections {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .sections a {
      padding: 28px 20px 30px 0;
      color: var(--text);
      text-decoration: none;
      border-right: 1px solid var(--line);
    }

    .sections a:last-child {
      border-right: none;
      padding-left: 20px;
    }

    .sections a:nth-child(2) {
      padding-left: 20px;
    }

    .section-number {
      display: block;
      margin-bottom: 14px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .section-title {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 34px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .sections a:hover .section-title {
      color: var(--muted);
    }

    footer {
      padding-top: 28px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .site {
        padding: 26px 22px 36px;
      }

      header {
        display: block;
      }

      nav {
        margin-top: 15px;
        gap: 18px;
      }

      main {
        justify-content: flex-start;
        padding: 64px 0;
      }

      .intro {
        margin-bottom: 54px;
      }

      .intro h1 {
        font-size: clamp(48px, 14vw, 68px);
      }

      .sections {
        display: block;
      }

      .sections a,
      .sections a:nth-child(2),
      .sections a:last-child {
        display: block;
        padding: 24px 0;
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .sections a:last-child {
        border-bottom: none;
      }
    }
  </style>
</head>

<body>

  <div class="site">

    <header>
      <div class="name">Gordon Stirling</div>

      <nav>
        <a href="writing.html">Writing</a>
        <a href="research.html">Research</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main>

      <div class="intro">
        <h1>Data, decision-making, performance and practice.</h1>

        <p>
          Writing and research exploring how data can be used more effectively
          in applied environments.
        </p>
      </div>

      <div class="sections">

        <a href="writing.html">
          <span class="section-number">01</span>
          <span class="section-title">Writing</span>
        </a>

        <a href="research.html">
          <span class="section-number">02</span>
          <span class="section-title">Research</span>
        </a>

        <a href="about.html">
          <span class="section-number">03</span>
          <span class="section-title">About</span>
        </a>

      </div>

    </main>

    <footer>
      Gordon Stirling
    </footer>

  </div>

</body>
</html>
